<body><header class="site"><div class="wrap"><a href="/Name/">传统文化宝宝起名</a></div></header><main class="wrap"><p><a href="/Name/knowledge/">知识首页</a></p><h1>地支藏干</h1><p class="lead">每个地支可包含一个或多个藏干。本项目明确区分主气、中气、余气，并保留每项证据。</p><section class="card"><h2>主中余气</h2><p>藏干不是把地支简单替换成一个天干；多项藏干按固定表逐项展示。</p></section><section class="card"><h2>十神映射</h2><p>十神以日干为基准映射每项藏干，仅用于传统结构解释，不参与姓名加减分。</p></section><section aria-labelledby="boundary"><h2 id="boundary">使用边界</h2><p>内容用于解释本项目的确定性计算口径，不构成现实命运判断，也不替代历书、字典、登记机关或专业意见。</p></section></main><footer><div class="wrap"><nav aria-label="知识主题"><strong>继续阅读</strong><ul><li><a href="/Name/knowledge/tiangan/">十天干基础</a></li><li><a href="/Name/knowledge/dizhi/">十二地支基础</a></li><li><a href="/Name/knowledge/wuxing/">五行与起名方向</a></li><li><a href="/Name/knowledge/bazi/">八字结构如何阅读</a></li><li><a href="/Name/knowledge/hidden-stems/">地支藏干</a></li><li><a href="/Name/knowledge/solar-terms/">节气与月令边界</a></li><li><a href="/Name/knowledge/naming/">可解释姓名推荐</a></li></ul></nav><p><a href="/Name/about.html">方法、数据与隐私说明</a></p></div></footer></body></html>
